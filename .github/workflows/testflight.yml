# Fork-only sideload build. No signing environment, Apple credentials, or release publishing.
name: Sideload IPA

on:
  push:
    branches: [build/ipa-dark-mode]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sideload-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  BUILD_NAME: 1.3.0
  BUILD_NUMBER: "7"
  XCODE_VERSION: "26.6"
  XCODE_BUILD: 17F113

jobs:
  sideload:
    name: Build unsigned iPhone IPA
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Select the pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcode="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$xcode" ]; then
            echo "Xcode $XCODE_VERSION is unavailable. Installed Xcodes:"
            ls -d /Applications/Xcode_*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -version | grep -q "Build version $XCODE_BUILD"

      - name: Compile the current branch without signing
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Package and verify the unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app=build/ios/iphoneos/Runner.app
          test -d "$app"
          test ! -e "$app/embedded.mobileprovision"
          mkdir -p "$RUNNER_TEMP/sideload/Payload" "$RUNNER_TEMP/output"
          cp -R "$app" "$RUNNER_TEMP/sideload/Payload/"
          ipa="$RUNNER_TEMP/output/BiliFast-${BUILD_NAME}-${BUILD_NUMBER}-dark-mode.ipa"
          (cd "$RUNNER_TEMP/sideload" && zip -qry "$ipa" Payload)
          IPA_PATH="$ipa" python3 - <<'PY'
          import hashlib, json, os, plistlib, struct, zipfile
          from pathlib import Path
          path = Path(os.environ['IPA_PATH'])
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              root = 'Payload/Runner.app/'
              info = plistlib.loads(archive.read(root + 'Info.plist'))
              assert info['CFBundleIdentifier'] == 'com.kaichuan.bilifast'
              assert info['CFBundleShortVersionString'] == os.environ['BUILD_NAME']
              assert info['CFBundleVersion'] == os.environ['BUILD_NUMBER']
              assert 'iPhoneOS' in info['CFBundleSupportedPlatforms']
              assert not any(name.endswith('embedded.mobileprovision') for name in archive.namelist())
              binary = archive.read(root + info['CFBundleExecutable'])
              assert struct.unpack('<II', binary[:8]) == (0xfeedfacf, 0x0100000c), 'expected ARM64 Mach-O'
              assert root + 'Frameworks/App.framework/App' in archive.namelist()
          manifest = {
              'source_commit': os.environ['GITHUB_SHA'],
              'version': info['CFBundleShortVersionString'],
              'build': info['CFBundleVersion'],
              'bundle_id': info['CFBundleIdentifier'],
              'minimum_ios': info.get('MinimumOSVersion'),
              'unsigned': True,
              'bytes': path.stat().st_size,
              'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
          }
          path.with_suffix('.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-ipa
          path: ${{ runner.temp }}/output/*
          if-no-files-found: error
          retention-days: 7
